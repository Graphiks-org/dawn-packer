name: spike-windows-msvc

# Throwaway spike workflow. Triggered by a push on its own branch because
# `workflow_dispatch` only lists workflows that already exist on the default
# branch, and this spike must not touch master before it has a verdict.
on:
  push:
    branches: ["spike/windows-msvc"]
  workflow_dispatch:

permissions:
  contents: read
  # Needed to download an artifact produced by an earlier run, so the
  # acceptance criterion can be retried without rebuilding Dawn for 30 minutes.
  actions: read

jobs:
  # Rounds 1 to 3 established: MSVC builds the DLL, MinGW links against the MSVC
  # import library and runs against the DLL, the DLL needs the VC++ runtime, the
  # static CRT breaks the build (Abseil cctz: LNK2019 __imp__mktime64), and
  # `cinterop` does produce a klib for webgpu.h once it is given the include
  # directory. What failed last was the compiler not finding that klib, which is
  # a search-path detail rather than a toolchain limit.
  kotlin-native:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reuse the shared install tree from round 3
        uses: actions/download-artifact@v4
        with:
          name: spike-windows-install
          path: spike-install
          run-id: 36602346651
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate what the probe needs
        shell: pwsh
        run: |
          $header = Get-ChildItem spike-install -Recurse -Filter webgpu.h |
            Where-Object { $_.FullName -match "\\include\\webgpu\\webgpu\.h$" } | Select-Object -First 1
          if (-not $header) { throw "include/webgpu/webgpu.h not found after download" }
          $inc = $header.Directory.Parent.FullName
          $lib = (Get-ChildItem spike-install -Recurse -Filter webgpu_dawn.lib | Select-Object -First 1).FullName
          "include: $inc"
          "import lib: $lib"
          "dll: $((Get-ChildItem spike-install -Recurse -Filter webgpu_dawn.dll | Select-Object -First 1).FullName)"

      - name: Fetch the Kotlin/Native compiler
        shell: pwsh
        run: |
          $version = "2.4.20"
          $url = "https://github.com/JetBrains/kotlin/releases/download/v$version/kotlin-native-prebuilt-windows-x86_64-$version.zip"
          Invoke-WebRequest -Uri $url -OutFile kotlin-native.zip
          Expand-Archive kotlin-native.zip -DestinationPath konan
          $konan = (Get-ChildItem konan -Directory | Select-Object -First 1).FullName
          "konan: $konan"
          & "$konan\bin\kotlinc-native.bat" -version 2>&1 | Select-Object -First 3
          "=== library search options the compiler accepts ==="
          & "$konan\bin\kotlinc-native.bat" -help 2>&1 | Select-String -Pattern "repo|library" | Select-Object -First 12 | ForEach-Object { $_.Line.Trim() }

      - name: cinterop against webgpu.h
        shell: pwsh
        run: |
          $konan = (Get-ChildItem konan -Directory | Select-Object -First 1).FullName
          $header = Get-ChildItem spike-install -Recurse -Filter webgpu.h |
            Where-Object { $_.FullName -match "\\include\\webgpu\\webgpu\.h$" } | Select-Object -First 1
          $inc = ($header.Directory.Parent.FullName) -replace "\\", "/"
          $lib = ((Get-ChildItem spike-install -Recurse -Filter webgpu_dawn.lib | Select-Object -First 1).FullName) -replace "\\", "/"
          New-Item -ItemType Directory -Force -Path knproj | Out-Null
          @"
          headers = webgpu/webgpu.h
          package = webgpu
          compilerOpts = -I$inc
          linkerOpts = $lib
          "@ | Set-Content -Path knproj/webgpu.def -Encoding ascii
          Push-Location knproj
          & "$konan\bin\cinterop.bat" -def webgpu.def -o webgpu -target mingw_x64 -compiler-option -I$inc 2>&1 | Select-Object -Last 10
          "cinterop exit: $LASTEXITCODE"
          Get-ChildItem | Select-Object -ExpandProperty Name
          Pop-Location

      - name: Build and run the Kotlin/Native consumer
        shell: pwsh
        run: |
          $konan = (Get-ChildItem konan -Directory | Select-Object -First 1).FullName
          $lib = ((Get-ChildItem spike-install -Recurse -Filter webgpu_dawn.lib | Select-Object -First 1).FullName) -replace "\\", "/"
          $dll = (Get-ChildItem spike-install -Recurse -Filter webgpu_dawn.dll | Select-Object -First 1).FullName
          @"
          @file:OptIn(kotlinx.cinterop.ExperimentalForeignApi::class)

          import webgpu.*

          fun main() {
              val instance = wgpuCreateInstance(null)
              if (instance == null) {
                  println("wgpuCreateInstance returned NULL")
                  return
              }
              wgpuInstanceRelease(instance)
              println("kotlin/native mingwX64 webgpu smoke test OK")
          }
          "@ | Set-Content -Path knproj/main.kt -Encoding ascii
          Push-Location knproj
          # `-library` takes a path, not a name (see the compiler's own help:
          # "-library (-l) <path>   Link with the given library."). `-repo` does
          # not exist in this version, and a klib passed as a positional input is
          # rejected as "not a Kotlin file".
          "=== kotlinc-native: -library with the klib path ==="
          & "$konan\bin\kotlinc-native.bat" main.kt -library "$PWD/webgpu.klib" -target mingw_x64 -o app -linker-option $lib 2>&1 | Tee-Object -FilePath ../kotlinc-native.log | Select-Object -Last 20
          "kotlinc-native exit: $LASTEXITCODE"
          Get-ChildItem | Select-Object -ExpandProperty Name
          if (Test-Path app.exe) {
            Copy-Item $dll .
            "=== running the Kotlin/Native binary ==="
            & ./app.exe
            "run exit: $LASTEXITCODE"
          } else {
            "app.exe was not produced"
            exit 1
          }
          Pop-Location

      - name: Upload the Kotlin/Native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-kotlin-native
          path: |
            kotlinc-native.log
            knproj/webgpu.def
            knproj/main.kt
          if-no-files-found: warn
