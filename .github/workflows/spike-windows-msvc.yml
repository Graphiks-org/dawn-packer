name: spike-windows-msvc

# Throwaway spike workflow. Triggered by a push on its own branch because
# `workflow_dispatch` only lists workflows that already exist on the default
# branch, and this spike must not touch master before it has a verdict.
on:
  push:
    branches: ["spike/windows-msvc"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Rounds 1 and 2 answered the C-level question: MSVC builds the DLL, and MinGW
  # gcc 14.2 links a C consumer against the MSVC import library and runs it
  # against the DLL (compile 0, link 0, run 0, "dawn-packer smoke test OK").
  # What is left is the actual acceptance criterion, plus one distribution
  # constraint: the DLL depends on MSVCP140/VCRUNTIME140, so ask whether running
  # the build with the static CRT removes that dependency.
  static-crt:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Enter the MSVC environment
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          >>"%GITHUB_ENV%" echo INCLUDE=%INCLUDE%
          >>"%GITHUB_ENV%" echo LIB=%LIB%
          >>"%GITHUB_ENV%" echo PATH=%PATH%

      - name: Configure with the static CRT
        shell: pwsh
        run: |
          cmake -S . -B build/spike-crt -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DDAWN_PACKER_LINKAGE=SHARED `
            -DDAWN_EMIT_COVERAGE=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_INSTALL_PREFIX="$PWD/dist/spike-crt" `
            -DDAWN_ENABLE_D3D12=ON `
            -DDAWN_ENABLE_NULL=ON 2>&1 | Tee-Object -FilePath configure-crt.log | Select-Object -Last 3
          "=== did the variable survive Dawn's own settings? ==="
          Select-String -Path build/spike-crt/CMakeCache.txt -Pattern "CMAKE_MSVC_RUNTIME_LIBRARY" | ForEach-Object { $_.Line }

      - name: Build and install
        shell: pwsh
        run: |
          cmake --build build/spike-crt --target dawn_packer 2>&1 | Tee-Object -FilePath build-crt.log | Select-Object -Last 3
          cmake --install build/spike-crt --prefix "$PWD/dist/spike-crt"

      - name: Runtime dependencies with the static CRT
        shell: pwsh
        run: |
          $dll = (Get-ChildItem dist/spike-crt -Recurse -Filter webgpu_dawn.dll | Select-Object -First 1).FullName
          "dll: $dll"
          $deps = & dumpbin /dependents $dll | Select-String -Pattern "\.dll" | ForEach-Object { $_.Line.Trim() }
          $deps
          $runtime = $deps | Where-Object { $_ -match "MSVCP|VCRUNTIME|ucrtbase" }
          "MSVC runtime dependencies: $($runtime.Count)"
          $runtime | ForEach-Object { "  $_" }

      - name: Consumption probe, static CRT build
        shell: pwsh
        run: |
          $dll = (Get-ChildItem dist/spike-crt -Recurse -Filter webgpu_dawn.dll | Select-Object -First 1).FullName
          $lib = (Get-ChildItem dist/spike-crt -Recurse -Filter webgpu_dawn.lib | Select-Object -First 1).FullName
          # Match the exact include/webgpu/webgpu.h layout: a search for a
          # directory named "webgpu" would also match webgpu_upstream/webgpu.
          $header = Get-ChildItem dist/spike-crt -Recurse -Filter webgpu.h |
            Where-Object { $_.FullName -match "\\include\\webgpu\\webgpu\.h$" } | Select-Object -First 1
          if (-not $header) { throw "include/webgpu/webgpu.h not found in the install tree" }
          $inc = $header.Directory.Parent.FullName
          "include dir: $inc (header: $(Test-Path "$inc/webgpu/webgpu.h"))"
          New-Item -ItemType Directory -Force -Path probe-crt | Out-Null
          & "C:\mingw64\bin\gcc.exe" -I $inc -c scripts/smoke-test/link-test.c -o probe-crt/link-test.o 2>&1
          "compile exit: $LASTEXITCODE"
          & "C:\mingw64\bin\gcc.exe" probe-crt/link-test.o $lib -o probe-crt/link-test.exe 2>&1
          "link exit: $LASTEXITCODE"
          Copy-Item $dll probe-crt/ -Force
          & ./probe-crt/link-test.exe
          "run exit: $LASTEXITCODE"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-static-crt
          path: |
            dist/spike-crt/bin/*.dll
            dist/spike-crt/lib/*.lib
            configure-crt.log
            build-crt.log
          if-no-files-found: warn

  # The acceptance criterion: a real mingwX64 Kotlin/Native cinterop project
  # linked against the MSVC import library and executed. Round 2 failed on the
  # probe itself, not on the toolchain: the .def's compilerOpts did not reach the
  # compiler, so the header was not found. This round passes the include
  # directory on the command line as well, uses forward slashes, and checks the
  # resolved paths before invoking anything.
  kotlin-native:
    needs: msvc-shared-warm
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download the install tree
        uses: actions/download-artifact@v4
        with:
          name: spike-windows-install
          path: spike-install

      - name: Locate what the probe needs
        shell: pwsh
        run: |
          "=== downloaded layout ==="
          Get-ChildItem spike-install -Recurse -Depth 3 | ForEach-Object { $_.FullName }
          # Match the exact include/webgpu/webgpu.h layout: a search for a
          # directory named "webgpu" would also match webgpu_upstream/webgpu.
          $header = Get-ChildItem spike-install -Recurse -Filter webgpu.h |
            Where-Object { $_.FullName -match "\\include\\webgpu\\webgpu\.h$" } | Select-Object -First 1
          if (-not $header) { throw "include/webgpu/webgpu.h not found after download" }
          $inc = $header.Directory.Parent.FullName
          $lib = (Get-ChildItem spike-install -Recurse -Filter webgpu_dawn.lib | Select-Object -First 1).FullName
          "include dir: $inc (exists: $(Test-Path $inc))"
          "import lib : $lib (exists: $(Test-Path $lib))"
          "header     : $(Test-Path "$inc/webgpu/webgpu.h")"

      - name: Fetch the Kotlin/Native compiler
        shell: pwsh
        run: |
          $version = "2.4.20"
          $url = "https://github.com/JetBrains/kotlin/releases/download/v$version/kotlin-native-prebuilt-windows-x86_64-$version.zip"
          Invoke-WebRequest -Uri $url -OutFile kotlin-native.zip
          "downloaded: $((Get-Item kotlin-native.zip).Length) bytes"
          Expand-Archive kotlin-native.zip -DestinationPath konan
          $konan = (Get-ChildItem konan -Directory | Select-Object -First 1).FullName
          "konan: $konan"
          "compiler version:"
          & "$konan\bin\kotlinc-native.bat" -version 2>&1 | Select-Object -First 5

      - name: cinterop against webgpu.h
        shell: pwsh
        run: |
          $konan = (Get-ChildItem konan -Directory | Select-Object -First 1).FullName
          $header = Get-ChildItem spike-install -Recurse -Filter webgpu.h |
            Where-Object { $_.FullName -match "\\include\\webgpu\\webgpu\.h$" } | Select-Object -First 1
          $inc = ($header.Directory.Parent.FullName) -replace "\\", "/"
          $lib = ((Get-ChildItem spike-install -Recurse -Filter webgpu_dawn.lib | Select-Object -First 1).FullName) -replace "\\", "/"
          "include: $inc"
          "import lib: $lib"
          New-Item -ItemType Directory -Force -Path knproj | Out-Null
          # The .def gets forward slashes; the include path is also passed on the
          # command line so a .def parsing quirk cannot hide the real error.
          @"
          headers = webgpu/webgpu.h
          package = webgpu
          compilerOpts = -I$inc
          linkerOpts = $lib
          "@ | Set-Content -Path knproj/webgpu.def -Encoding ascii
          "=== def ==="
          Get-Content knproj/webgpu.def
          Push-Location knproj
          & "$konan\bin\cinterop.bat" -def webgpu.def -o webgpu -target mingw_x64 -compiler-option -I$inc 2>&1 | Tee-Object -FilePath ../cinterop.log | Select-Object -Last 25
          "cinterop exit: $LASTEXITCODE"
          Get-ChildItem | Select-Object -ExpandProperty Name
          if (-not (Test-Path webgpu.klib)) { "no klib produced" }
          Pop-Location

      - name: Build and run the Kotlin/Native consumer
        shell: pwsh
        run: |
          $konan = (Get-ChildItem konan -Directory | Select-Object -First 1).FullName
          $lib = ((Get-ChildItem spike-install -Recurse -Filter webgpu_dawn.lib | Select-Object -First 1).FullName) -replace "\\", "/"
          $dll = (Get-ChildItem spike-install -Recurse -Filter webgpu_dawn.dll | Select-Object -First 1).FullName
          @"
          import webgpu.*
          import kotlinx.cinterop.*

          fun main() {
              val instance = wgpuCreateInstance(null)
              if (instance == null) {
                  println("wgpuCreateInstance returned NULL")
                  return
              }
              wgpuInstanceRelease(instance)
              println("kotlin/native mingwX64 webgpu smoke test OK")
          }
          "@ | Set-Content -Path knproj/main.kt -Encoding ascii
          Push-Location knproj
          "=== kotlinc-native ==="
          & "$konan\bin\kotlinc-native.bat" main.kt -library webgpu -target mingw_x64 -o app -linker-option $lib 2>&1 | Tee-Object -FilePath ../kotlinc-native.log | Select-Object -Last 25
          "kotlinc-native exit: $LASTEXITCODE"
          Get-ChildItem | Select-Object -ExpandProperty Name
          if (Test-Path app.exe) {
            Copy-Item $dll .
            "=== running the Kotlin/Native binary ==="
            & ./app.exe
            "run exit: $LASTEXITCODE"
          } else { "app.exe was not produced" }
          Pop-Location

      - name: Upload the Kotlin/Native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-kotlin-native
          path: |
            cinterop.log
            kotlinc-native.log
            knproj/webgpu.def
            knproj/main.kt
          if-no-files-found: warn

  # Supplies the shared install tree the Kotlin/Native job consumes. Kept as its
  # own job so the acceptance criterion can be re-run without rebuilding Dawn.
  msvc-shared-warm:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Enter the MSVC environment
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          >>"%GITHUB_ENV%" echo INCLUDE=%INCLUDE%
          >>"%GITHUB_ENV%" echo LIB=%LIB%
          >>"%GITHUB_ENV%" echo PATH=%PATH%

      - name: Build and install (shared, dynamic CRT)
        shell: pwsh
        run: |
          cmake -S . -B build/spike-shared -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DDAWN_PACKER_LINKAGE=SHARED `
            -DDAWN_EMIT_COVERAGE=OFF `
            -DCMAKE_INSTALL_PREFIX="$PWD/dist/spike-shared" `
            -DDAWN_ENABLE_D3D12=ON `
            -DDAWN_ENABLE_NULL=ON 2>&1 | Tee-Object -FilePath configure-shared.log | Select-Object -Last 3
          cmake --build build/spike-shared --target dawn_packer 2>&1 | Select-Object -Last 3
          cmake --install build/spike-shared --prefix "$PWD/dist/spike-shared"
          Get-ChildItem dist/spike-shared -Recurse -Include *.dll, *.lib | Select-Object FullName, Length | Format-Table -AutoSize | Out-String

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: spike-windows-install
          path: |
            dist/spike-shared/bin/*.dll
            dist/spike-shared/lib/*.lib
            dist/spike-shared/include
            configure-shared.log
          if-no-files-found: error
