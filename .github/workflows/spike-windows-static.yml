name: spike-windows-static

# Throwaway: measures whether an MSVC-built static Dawn library can be linked
# from MinGW. Triggered by changes to this file only, so the implementation
# commits that follow cannot re-run it, and it is deleted once it has answered.
#
# The step always exits 0 and prints a STATIC LINK marker: the deliverable is a
# measurement, so a red run would only confuse the record. The run of round 1
# failed on the probe itself -- an ARM ucrt.lib was handed to an x86_64 linker,
# and msvcp140.lib was looked for at a path that does not hold it -- so this
# round discovers both by search and reports what it found before linking.
on:
  push:
    branches: ["feat/windows-msvc-target"]
    paths: [".github/workflows/spike-windows-static.yml"]

permissions:
  contents: read

jobs:
  static-link:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Enter the MSVC environment
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          >>"%GITHUB_ENV%" echo INCLUDE=%INCLUDE%
          >>"%GITHUB_ENV%" echo LIB=%LIB%
          >>"%GITHUB_ENV%" echo PATH=%PATH%
          >>"%GITHUB_ENV%" echo VCToolsInstallDir=%VCToolsInstallDir%
          >>"%GITHUB_ENV%" echo VCToolsRedistDir=%VCToolsRedistDir%

      - name: Build and install (static)
        shell: pwsh
        run: |
          cmake -S . -B build/spike-static -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DDAWN_PACKER_LINKAGE=STATIC `
            -DDAWN_EMIT_COVERAGE=OFF -DCMAKE_INSTALL_PREFIX="$PWD/dist/spike-static" `
            -DDAWN_ENABLE_D3D12=ON -DDAWN_ENABLE_NULL=ON 2>&1 | Select-Object -Last 3
          cmake --build build/spike-static --target dawn_packer 2>&1 | Select-Object -Last 3
          cmake --install build/spike-static --prefix "$PWD/dist/spike-static"

      - name: Attempt a MinGW link against the MSVC static library
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          $lib = (Get-ChildItem dist/spike-static -Recurse -Filter webgpu_dawn.lib | Select-Object -First 1).FullName
          $header = Get-ChildItem dist/spike-static -Recurse -Filter webgpu.h |
            Where-Object { $_.FullName -match "\\include\\webgpu\\webgpu\.h$" } | Select-Object -First 1
          $inc = $header.Directory.Parent.FullName
          $vc = $env:VCToolsInstallDir
          "library: $lib"
          "VCToolsInstallDir: $vc"

          "=== MSVC import libraries available for x64 ==="
          Get-ChildItem "${vc}lib\x64" -Filter "*.lib" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name | Sort-Object | ForEach-Object { "  $_" }
          "=== anywhere else, in case the toolset moved them ==="
          Get-ChildItem $vc -Recurse -Filter "msvcp140.lib" -ErrorAction SilentlyContinue |
            ForEach-Object { "  msvcp140.lib -> $($_.FullName)" }
          Get-ChildItem $env:VCToolsRedistDir -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 20 -ExpandProperty FullName | ForEach-Object { "  redist: $_" }

          # The x64 flavour only: a recursive search without this filter picked
          # an arm import library in round 1 and the linker rejected it.
          $sdk = "C:\Program Files (x86)\Windows Kits\10\Lib"
          $ucrt = Get-ChildItem $sdk -Recurse -Filter ucrt.lib -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\ucrt\\x64\\ucrt\.lib$" } |
            Sort-Object FullName | Select-Object -Last 1
          "ucrt (x64): $($ucrt.FullName)"

          # Two attempts, and neither may be conflated with the other. The first
          # uses only the dynamic CRT import libraries, which is what a real
          # consumer would link. The second is a diagnostic: adding the static
          # CRT libraries could satisfy the symbols by mixing two runtimes, and
          # a success there would mean nothing for shipping.
          $dynamic = @(
            "${vc}lib\x64\vcruntime.lib",
            "${vc}lib\x64\vcruntime140.lib",
            "${vc}lib\x64\vcruntime140_1.lib",
            "${vc}lib\x64\msvcp140.lib",
            "${vc}lib\x64\msvcp140_1.lib",
            "${vc}lib\x64\msvcp140_2.lib",
            "${vc}lib\x64\msvcp140_atomic_wait.lib",
            "${vc}lib\x64\concrt140.lib",
            "${vc}lib\x64\oldnames.lib",
            "$($ucrt.FullName)"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $staticExtra = @(
            "${vc}lib\x64\libcmt.lib",
            "${vc}lib\x64\libcpmt.lib",
            "${vc}lib\x64\libvcruntime.lib"
          ) | Where-Object { $_ -and (Test-Path $_) }

          New-Item -ItemType Directory -Force -Path probe | Out-Null
          & "C:\mingw64\bin\gcc.exe" -I $inc -c scripts/smoke-test/link-test.c -o probe/link-test.o 2>&1
          "compile exit: $LASTEXITCODE"

          "=== attempt 1: dynamic CRT import libraries only ($($dynamic.Count) libraries) ==="
          $dynamic | ForEach-Object { "  $_" }
          & "C:\mingw64\bin\gcc.exe" probe/link-test.o $lib $dynamic -o probe/link-test.exe 2>&1 |
            Select-Object -First 40
          "link exit: $LASTEXITCODE"
          if (Test-Path probe/link-test.exe) {
            Remove-Item probe/link-test.exe -Force
            "STATIC LINK (dynamic CRT): OK"
          } else {
            "STATIC LINK (dynamic CRT): FAILED"
          }

          "=== attempt 2: diagnostic, adding the static CRT libraries ==="
          & "C:\mingw64\bin\gcc.exe" probe/link-test.o $lib $dynamic $staticExtra -o probe/link-test.exe 2>&1 |
            Select-Object -First 40
          "link exit: $LASTEXITCODE"
          if (Test-Path probe/link-test.exe) {
            & ./probe/link-test.exe 2>&1 | Select-Object -First 10
            "run exit: $LASTEXITCODE"
            "STATIC LINK (mixed CRT): OK, but mixing runtimes is not shippable"
          } else {
            "STATIC LINK (mixed CRT): FAILED"
          }
          exit 0
