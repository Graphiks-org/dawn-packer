name: build

# Manual dispatch and version tags only. A manual run builds the full matrix
# generated from targets/matrix.json unless `targets` / `linkages` narrow it:
#   gh workflow run build.yml --ref master
#   gh workflow run build.yml --ref master -f targets=linuxX64 -f linkages=static
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated kotlinTarget ids (empty = the full matrix)"
        required: false
        type: string
      linkages:
        description: "Comma-separated linkages: static, shared (empty = both)"
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Emit the build matrix from targets/matrix.json (dropped targets excluded).
  # All watchOS targets are dropped and never reach CI; this job is the single
  # source of truth for what is built.
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate build matrix
        id: gen
        env:
          # Empty on a push event, which is the full matrix.
          TARGETS: ${{ inputs.targets }}
          LINKAGES: ${{ inputs.linkages }}
        run: |
          set -euo pipefail
          # Assignment form: a non-zero exit from the generator fails the step
          # here, where the message is readable, instead of silently writing an
          # empty matrix into GITHUB_OUTPUT.
          matrix="$(python3 scripts/gen-ci-matrix.py)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "matrix entries: $(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "$matrix")"

  # Genuinely fast contract tests. Deliberately excludes every test that runs a
  # real Dawn build or duplicates the per-target `build` job below:
  # tests/test-build-target.sh, tests/test-all-targets-buildable.sh,
  # tests/test-shared-symbols.sh (builds a native shared archive) and
  # tests/test-build-target-protoc.sh (rebuilds host protoc, ~100s).
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Never init Dawn's recursive submodules: v8, LLVM, SwiftShader and
          # ANGLE are multi-GB and unnecessary. `dawn` is initialised here
          # (non-recursively) and Dawn's CMake dependency fetching populates
          # third_party.
          submodules: true
      - name: Fast tests
        run: |
          set -euo pipefail
          tests=(
            tests/test-sync.sh
            tests/test-validate-matrix.sh
            tests/test-make-manifest.sh
            tests/test-validate-manifest.sh
            tests/test-package.sh
            tests/test-run-smoke-test.sh
            tests/test-gen-ci-matrix.sh
          )
          for test_script in "${tests[@]}"; do
            echo "=== ${test_script} ==="
            bash "${test_script}"
          done

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Submodules are non-recursive. `scripts/sync.sh` re-initialises
          # `dawn` idempotently; keeping the submodule out of the recursive
          # graph avoids multi-GB downloads that are never used.
          submodules: true

      # MSVC has to be on PATH for the configure step and for dumpbin, which
      # resolves the runtime DLLs after the install. vcvars writes the whole
      # environment, so it is exported for the later steps instead of being
      # re-entered.
      - name: Enter the MSVC environment
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          if "%VS_PATH%"=="" (
            echo ::error::no Visual Studio installation with the C++ toolset was found
            exit /b 1
          )
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          >>"%GITHUB_ENV%" echo INCLUDE=%INCLUDE%
          >>"%GITHUB_ENV%" echo LIB=%LIB%
          >>"%GITHUB_ENV%" echo PATH=%PATH%
          >>"%GITHUB_ENV%" echo VCToolsRedistDir=%VCToolsRedistDir%

      # The smoke test links with the HOST linker, so it is only meaningful for
      # the runner's own target. Derive that target once here and compare it when
      # deciding smoke test vs structural check.
      - name: Derive host target
        id: host
        # Git Bash, so `uname` is available on every runner the matrix uses.
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)/$(uname -m)" in
            Darwin/arm64) host_target=macosArm64 ;;
            Linux/x86_64) host_target=linuxX64 ;;
            Linux/aarch64 | Linux/arm64) host_target=linuxArm64 ;;
            MINGW64_NT-*/x86_64 | MSYS_NT-*/x86_64) host_target=mingwX64 ;;
            *)
              echo "::error::unsupported runner host $(uname -s)/$(uname -m)"
              exit 1
              ;;
          esac
          echo "host=$host_target" >> "$GITHUB_OUTPUT"
          echo "runner host target: $host_target"

      # Keyed on the pinned Dawn tag + resolved revision and the runner
      # OS/arch, so a dependency change invalidates the cache.
      - name: Cache Dawn dependencies
        uses: actions/cache@v4
        with:
          path: dawn/third_party
          key: dawn-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dawn-pin.env') }}-${{ hashFiles('.git/modules/dawn/HEAD') }}

      # Cross builds need a host `protoc` (the host protoc bootstrap step,
      # ~100s to build); only the cross targets (Android/iOS/tvOS) use it.
      # Cached separately from the Dawn deps so a native job never saves an
      # empty directory.
      - name: Cache host protoc
        if: startsWith(matrix.target, 'android') || startsWith(matrix.target, 'ios') || startsWith(matrix.target, 'tvos')
        uses: actions/cache@v4
        with:
          path: build/host-protoc
          key: host-protoc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dawn-pin.env') }}-${{ hashFiles('.git/modules/dawn/HEAD') }}

      - name: Sync Dawn
        shell: bash
        run: bash scripts/sync.sh

      # Dawn needs X11/GL development packages for the Linux host builds
      # (linuxX64/linuxArm64). Android targets get their headers from the NDK,
      # so this step is skipped for them.
      - name: Install Linux deps
        if: runner.os == 'Linux' && !startsWith(matrix.target, 'android')
        run: |
          sudo apt-get update
          sudo apt-get install -y libxrandr-dev libxinerama-dev libxcursor-dev \
            mesa-common-dev libx11-xcb-dev pkg-config ninja-build clang
          # The Linux targets build with Clang (see targets/matrix.json): Dawn's
          # C++20 module target needs import-graph scanning, which CMake 3.28
          # only provides for Clang 16+. Print the version so a runner image
          # change shows up in the log rather than as a configure error.
          clang --version

      # Pin the NDK to the revision validated in docs/spikes/android.md
      # (27.3.13750724, API 26) and fail loudly instead of silently building
      # against whichever NDK happens to be active.
      - name: Pin Android NDK 27.3.13750724
        if: startsWith(matrix.target, 'android')
        run: |
          set -euo pipefail
          ndk_version=27.3.13750724
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ]; then
            echo "::error::ANDROID_SDK_ROOT/ANDROID_HOME is not set; cannot locate NDK $ndk_version"
            exit 1
          fi
          ndk_dir="$sdk_root/ndk/$ndk_version"
          if [ ! -d "$ndk_dir" ]; then
            echo "::error::pinned Android NDK $ndk_version not found at $ndk_dir"
            echo "installed NDK revisions under $sdk_root/ndk:"
            ls -1 "$sdk_root/ndk" 2>/dev/null || echo "  (none)"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"
          echo "using pinned Android NDK $ndk_version at $ndk_dir"

      - name: Build
        shell: bash
        run: bash scripts/build-target.sh '${{ matrix.target }}' '${{ matrix.linkage }}'

      - name: Package
        shell: bash
        run: bash scripts/package.sh '${{ matrix.target }}' '${{ matrix.linkage }}'

      # The manifest must describe the archive exactly. Cheap, and it is the
      # control that would have caught the dropped Windows DLL.
      - name: Archive inventory check
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          target="${{ matrix.target }}"
          linkage="${{ matrix.linkage }}"
          archives=(dist/$target/dawn-*-$target-$linkage.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected exactly one $linkage archive for $target, found ${#archives[@]}"
            exit 1
          fi
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          tar xzf "${archives[0]}" -C "$work"
          python3 packaging/check-inventory.py "${archives[0]}" "$work/manifest.json" "$work"

      # Verify the ELF version script kept Linux shared archives to the public
      # API. Runs on the Linux host, so no extra build is needed.
      - name: Shared symbol check (Linux)
        if: runner.os == 'Linux' && matrix.linkage == 'shared'
        run: |
          set -euo pipefail
          shopt -s nullglob
          target="${{ matrix.target }}"
          archives=(dist/$target/dawn-*-$target-shared.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected exactly one shared archive for $target, found ${#archives[@]}"
            exit 1
          fi
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          tar xzf "${archives[0]}" -C "$work"
          so="$(find "$work/lib" -name '*.so' -print -quit)"
          [ -n "$so" ] || { echo "::error::shared library missing from ${archives[0]}"; exit 1; }
          defined="$(nm -D --defined-only "$so" | awk 'NF>=3 {print $3}')"
          [ -n "$defined" ] || { echo "::error::no dynamic symbols in $so"; exit 1; }
          leaked="$(printf '%s\n' "$defined" | grep -Ev '^_?(wgpu|dawn)' | grep -v '^$' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::leaked non-wgpu/dawn symbols in $so:"
            printf '%s\n' "$leaked" | head -n 40
            exit 1
          fi
          count="$(printf '%s\n' "$defined" | grep -Ec '^_?(wgpu|dawn)' || true)"
          echo "shared symbol check OK: $count wgpu/dawn symbols, 0 leaks"

      # The Windows equivalent of the ELF version script check, against a
      # different invariant: MSVC only exports what is explicitly marked, so the
      # risk is a third-party symbol leaking rather than the C API being
      # over-exported. Dawn's monolithic shared build defines
      # DAWN_NATIVE_SHARED_LIBRARY and DAWN_NATIVE_IMPLEMENTATION
      # (src/dawn/native/CMakeLists.txt:1049-1055), which makes DAWN_NATIVE_EXPORT
      # expand to __declspec(dllexport) (include/dawn/native/dawn_native_export.h),
      # so Dawn's native C++ API is exported on purpose. The accepted set is the
      # public C API plus MSVC-mangled names whose outermost namespace is `dawn`.
      #
      # Do not classify third-party names by substring: of the 111 mangled Dawn
      # exports, 7 contain `std@@` inside a template argument and 1 contains
      # `tint` by pure accident
      # (ResetInternalDeviceForTesting@Adapter@native@dawn@@), so a substring test
      # fails on Dawn's own symbols. A real Abseil or Tint leak carries `absl` or
      # `tint` as its outermost namespace, which the namespace rule catches
      # exactly.
      - name: Shared symbol check (Windows)
        if: runner.os == 'Windows' && matrix.linkage == 'shared'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          target="${{ matrix.target }}"
          archives=(dist/$target/dawn-*-$target-shared.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected exactly one shared archive for $target, found ${#archives[@]}"
            exit 1
          fi
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          tar xzf "${archives[0]}" -C "$work"
          dll="$(find "$work/bin" -name 'webgpu_dawn.dll' -print -quit)"
          [ -n "$dll" ] || { echo "::error::webgpu_dawn.dll missing from ${archives[0]}"; exit 1; }
          exports_file="$work/exports.txt"
          dumpbin //exports "$dll" | awk '/^ +[0-9]+ +[0-9A-F]+ +[0-9A-F]+ +/ {print $4}' > "$exports_file"
          [ -s "$exports_file" ] || { echo "::error::no exports found in $dll"; exit 1; }
          python3 - "$exports_file" <<'PY'
          import sys


          def is_public_c_api(name):
              # Not mangled, and after stripping any leading underscore starts
              # with the wgpu or dawn C API prefix.
              if name.startswith("?"):
                  return False
              return name.lstrip("_").startswith(("wgpu", "dawn"))


          def is_dawn_mangled(name):
              # MSVC decoration: the outermost namespace is the last @-separated
              # segment before the first @@.
              if not name.startswith("?"):
                  return False
              scope = name.split("@@", 1)[0]
              parts = scope.split("@")
              return bool(parts) and parts[-1] == "dawn"


          names = [line.strip() for line in open(sys.argv[1], encoding="utf-8") if line.strip()]
          if not names:
              sys.exit("no exports found")
          c_api = [name for name in names if is_public_c_api(name)]
          if not c_api:
              sys.exit("the public WebGPU C API is not exported")
          leaks = [name for name in names if not is_public_c_api(name) and not is_dawn_mangled(name)]
          if leaks:
              print(
                  "unrecognised exports in the DLL (neither the C API nor a Dawn-native mangled name):",
                  file=sys.stderr,
              )
              for name in leaks[:20]:
                  print(f"  {name}", file=sys.stderr)
              sys.exit(1)
          print(
              f"shared symbol check OK: {len(c_api)} C API exports, "
              f"{len(names) - len(c_api)} Dawn-native mangled exports, 0 leaks"
          )
          PY

      # Host-native archive: link against it and run the smoke binary.
      - name: Smoke test (host target)
        if: steps.host.outputs.host == matrix.target
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          target="${{ matrix.target }}"
          linkage="${{ matrix.linkage }}"
          archive_glob="dist/$target/dawn-*-$target-$linkage.tar.gz"
          archives=($archive_glob)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected exactly one archive matching $archive_glob, found ${#archives[@]}"
            ls -la "dist/$target" || true
            exit 1
          fi
          bash scripts/run-smoke-test.sh "${archives[0]}"

      # For every other target the host linker cannot link the archive, so
      # --link-only is NOT attempted. The build+package is the verification;
      # here we assert the archive's structure and manifest.
      - name: Structural check (cross target)
        if: steps.host.outputs.host != matrix.target
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          target="${{ matrix.target }}"
          linkage="${{ matrix.linkage }}"
          archive_glob="dist/$target/dawn-*-$target-$linkage.tar.gz"
          archives=($archive_glob)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected exactly one archive matching $archive_glob, found ${#archives[@]}"
            ls -la "dist/$target" || true
            exit 1
          fi
          archive="${archives[0]}"
          echo "structural check on $archive"
          listing="$(tar tzf "$archive")"
          grep -q '^lib/' <<<"$listing" || { echo "::error::archive is missing lib/"; exit 1; }
          grep -q '^include/webgpu/webgpu\.h$' <<<"$listing" || { echo "::error::archive is missing include/webgpu/webgpu.h"; exit 1; }
          grep -q '^manifest\.json$' <<<"$listing" || { echo "::error::archive is missing manifest.json"; exit 1; }
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          tar xzf "$archive" -C "$work" manifest.json
          python3 - "$work/manifest.json" "$target" "$linkage" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_target, expected_linkage = sys.argv[2], sys.argv[3]
          actual_target = manifest.get("target", {}).get("kotlinTarget")
          actual_linkage = manifest.get("linkage")
          if actual_target != expected_target:
              sys.exit(f"manifest kotlinTarget {actual_target!r} != {expected_target!r}")
          if actual_linkage != expected_linkage:
              sys.exit(f"manifest linkage {actual_linkage!r} != {expected_linkage!r}")
          print(f"structural check OK: {actual_target}/{actual_linkage}, {len(manifest['artifacts'])} artifacts")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dawn-${{ matrix.target }}-${{ matrix.linkage }}
          path: dist/${{ matrix.target }}/dawn-*.tar.gz
          if-no-files-found: error
